apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
  namespace: flask-mongo
data:
  init.sh: |
    #!/bin/sh
    mongosh admin -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --eval "
      db.getSiblingDB('$MONGO_DB').createUser({
        user: '$MONGO_USER',
        pwd: '$MONGO_PASSWORD',
        roles: [{ role: 'readWrite', db: '$MONGO_DB' }]
      })
    "

