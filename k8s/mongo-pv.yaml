apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  claimRef:
    namespace: flask-mongo
    name: mongo-data-mongo-0
  hostPath:
    path: /data/mongo
    type: DirectoryOrCreate

